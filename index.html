<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pay</title>
<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pay">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --card: #eef0f4;
  --ink: #111114;
  --muted: #8a8d96;
  --line: rgba(0, 0, 0, .07);
  --pill: rgba(0, 0, 0, .05);
  --hero: #dfe5ff;
  --hero-ink: #111114;
  --good: #dff3e3;
  --good-ink: #2f7a43;
  --cta: #111114;
  --cta-ink: #ffffff;
  --danger: #d92d20;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d10;
    --surface: #17171b;
    --card: #1d1d22;
    --ink: #f5f5f7;
    --muted: #8e8f98;
    --line: rgba(255, 255, 255, .08);
    --pill: rgba(255, 255, 255, .08);
    --hero: #242b4d;
    --hero-ink: #f5f5f7;
    --good: #1f3a27;
    --good-ink: #8fdca3;
    --cta: #ffffff;
    --cta-ink: #111114;
    --danger: #ff6b5e;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
.wrap { max-width: 480px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 120px); }

/* Đầu trang */
.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.brand { font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
.tright { display: flex; align-items: center; gap: 8px; }
.date { font-size: 14px; color: var(--muted); padding: 8px 14px; border-radius: 999px; background: var(--pill); }
.gear { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--pill); }
.gear svg { width: 20px; height: 20px; }

/* Thẻ số tiền */
.hero { border-radius: 32px; padding: 22px 22px 20px; background: var(--hero); color: var(--hero-ink); }
.hero .lbl { font-size: 15px; opacity: .6; }
.today { font-size: clamp(46px, 15vw, 64px); font-weight: 700; letter-spacing: -2.5px; line-height: 1.05; margin: 14px 0 16px; font-variant-numeric: tabular-nums; }
.today small { font-size: .5em; font-weight: 600; letter-spacing: 0; margin-left: 4px; opacity: .45; }
.hrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.mpill { white-space: nowrap; padding: 8px 14px; border-radius: 999px; background: var(--good); color: var(--good-ink); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cnt { font-size: 14px; opacity: .55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Ô danh mục */
.h2 { display: flex; justify-content: space-between; align-items: center; margin: 26px 2px 12px; }
.h2 b { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
.h2 button, .h2 span { font-size: 14px; color: var(--muted); padding: 7px 14px; border-radius: 999px; background: var(--pill); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { position: relative; border-radius: 28px; padding: 16px; min-height: 128px; text-align: left; color: #111114; display: flex; flex-direction: column; justify-content: space-between; transition: transform .12s; }
.tile:active { transform: scale(.97); }
.tile .ti { width: 50px; height: 50px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 25px; }
.tile .tn { font-size: 16px; font-weight: 500; margin-top: 14px; opacity: .75; }
.tile .ta { font-size: 21px; font-weight: 700; letter-spacing: -.4px; font-variant-numeric: tabular-nums; }
.tile .plus { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.55); display: grid; place-items: center; font-size: 20px; font-weight: 500; line-height: 1; }

/* Danh sách */
.list { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 16px 12px 12px; border-radius: 24px; background: var(--card); text-align: left; }
.ic { width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center; font-size: 26px; flex: none; }
.tx { flex: 1; min-width: 0; }
.nt { font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tm { color: var(--muted); font-size: 14px; margin-top: 2px; }
.am { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.empty { color: var(--muted); font-size: 16px; padding: 22px 18px; line-height: 1.55; border-radius: 24px; background: var(--card); text-align: center; }
.empty b { color: var(--ink); }
.daylbl { color: var(--muted); font-size: 14px; font-weight: 600; margin: 14px 4px 2px; display: flex; justify-content: space-between; }

/* 2 nút to dưới đáy */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px); background: var(--bg); border-top: 1px solid var(--line); }
.dock .in { max-width: 448px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.big { height: 76px; border-radius: 999px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 20px; white-space: nowrap; font-weight: 600; transition: transform .12s; }
.big:active { transform: scale(.97); }
.big .bi { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.big .bi svg { width: 26px; height: 26px; }
.big.soft { background: var(--card); }
.big.soft .bi { background: var(--surface); }
.big.cta { background: var(--cta); color: var(--cta-ink); }
.big.cta .bi { background: rgba(127,127,127,.25); }

/* ---------- Màn hình nhập số tiền ---------- */
.entry {
  position: fixed; inset: 0; z-index: 45; background: var(--surface); display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 8px) 18px calc(env(safe-area-inset-bottom) + 14px);
  transform: translateY(102%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
}
.entry.on { transform: none; }
.entry .in { max-width: 460px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; flex: 1; min-height: 0; }
.ehead { display: flex; align-items: center; gap: 10px; height: 48px; }
.back { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--pill); flex: none; }
.back svg { width: 22px; height: 22px; }
.etitle { font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.esub { color: var(--muted); font-size: 14px; margin: 2px 0 0 54px; min-height: 0; overflow-wrap: anywhere; }
.elbl { color: var(--muted); font-size: 14px; margin-top: 14px; }
.eamt { display: flex; align-items: baseline; gap: 6px; padding: 2px 0 10px; border-bottom: 2px solid var(--ink); font-variant-numeric: tabular-nums; }
.eamt .v { font-size: clamp(44px, 13vw, 56px); font-weight: 700; letter-spacing: -2px; line-height: 1.1; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eamt .v.zero { color: var(--muted); opacity: .5; }
.eamt .u { font-size: 20px; color: var(--muted); font-weight: 600; }
.echips { display: flex; gap: 8px; overflow-x: auto; margin: 14px -18px 0; padding: 0 18px 4px; scrollbar-width: none; }
.echips::-webkit-scrollbar { display: none; }
.echips button { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 16px 8px 8px; border-radius: 999px; background: var(--pill); font-size: 16px; font-weight: 500; border: 2px solid transparent; }
.echips button span { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; }
.echips button.sel { border-color: var(--ink); background: transparent; }
.enote { width: 100%; margin-top: 12px; padding: 14px 18px; border-radius: 18px; border: 0; background: var(--pill); outline: none; font-size: 17px; }
.keys { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: minmax(46px, 1fr); gap: 4px; margin: 10px 0 10px; max-height: 330px; align-self: stretch; }
.keys button { font-size: 30px; font-weight: 500; border-radius: 20px; display: grid; place-items: center; }
.keys button:active { background: var(--pill); }
.keys button.k000 { font-size: 24px; }
.keys svg { width: 30px; height: 30px; }
.eacts { display: flex; flex-direction: column; gap: 8px; }
.primary { height: 64px; border-radius: 999px; background: var(--cta); color: var(--cta-ink); font-size: 19px; font-weight: 600; }
.primary:disabled { opacity: .35; }
.secondary { height: 54px; border-radius: 999px; background: var(--pill); font-size: 17px; font-weight: 600; }
.del { height: 46px; color: var(--danger); font-weight: 600; }
.tip { color: var(--muted); font-size: 13px; text-align: center; margin-top: 8px; line-height: 1.45; }

/* ---------- Camera ---------- */
.cam { position: fixed; inset: 0; background: #000; z-index: 50; display: none; }
.cam.on { display: block; }
.cam video { width: 100%; height: 100%; object-fit: cover; }
.cam .frame { position: absolute; top: 50%; left: 50%; width: 68vmin; height: 68vmin; transform: translate(-50%, -55%); border: 3px solid rgba(255,255,255,.9); border-radius: 36px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.5); }
.cam .hint { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 24px); text-align: center; color: #fff; font-size: 17px; padding: 0 16px; }
.cam .bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
.cam .bar button, .cam .bar label { flex: 1; height: 68px; display: grid; place-items: center; border-radius: 999px; background: rgba(255,255,255,.18); color: #fff; font-weight: 600; font-size: 18px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); cursor: pointer; }
.cam .err { position: absolute; top: 40%; left: 16px; right: 16px; color: #fff; text-align: center; line-height: 1.5; font-size: 17px; }

/* ---------- Sheet (lịch sử, cài đặt) ---------- */
.dim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s; }
.dim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-width: 480px; margin: 0 auto;
  background: var(--surface); border-radius: 32px 32px 0 0; padding: 10px 16px calc(18px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  transform: translateY(105%); transition: transform .25s cubic-bezier(.2,.8,.2,1);
  max-height: 90dvh; display: flex; flex-direction: column;
}
.sheet.on { transform: none; }
.grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; flex: none; }
.stitle { font-size: 20px; font-weight: 700; margin: 0 4px 6px; }
.hist { overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px; padding-bottom: 6px; }
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px; border-radius: 22px; background: var(--card); margin-top: 10px; font-size: 17px; }
.field select { border: 0; background: none; outline: none; text-align: right; font-weight: 700; max-width: 60%; font-size: 17px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.grid3 button { height: 60px; border-radius: 20px; background: var(--card); font-weight: 600; font-size: 16px; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--cta); color: var(--cta-ink); padding: 15px 18px 15px 24px; border-radius: 999px; display: flex; gap: 18px; align-items: center; transition: .2s; z-index: 60; white-space: nowrap; font-size: 17px; font-weight: 500; }
.toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Pay</div>
    <div class="tright">
      <div class="date" id="date"></div>
      <button class="gear" id="setBtn" aria-label="Cài đặt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.8 20 7.4v9.2l-8 4.6-8-4.6V7.4z"/><circle cx="12" cy="12" r="3.2"/></svg></button>
    </div>
  </header>

  <section class="hero">
    <div class="lbl">Hôm nay đã chi</div>
    <div class="today" id="today">0<small>đ</small></div>
    <div class="hrow"><span class="mpill" id="month"></span><span class="cnt" id="cnt"></span></div>
  </section>

  <div class="h2"><b>Danh mục</b><span id="mlabel">Tháng này</span></div>
  <div class="tiles" id="tiles"></div>

  <div class="h2"><b>Gần đây</b><button id="allBtn">Xem tất cả</button></div>
  <div class="list" id="recent"></div>
</div>

<div class="dock"><div class="in">
  <button class="big soft" id="typeBtn">
    <span class="bi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Lưu
  </button>
  <button class="big cta" id="scanBtn">
    <span class="bi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M7 12h10"/></svg></span>Quét QR
  </button>
</div></div>

<!-- Màn hình nhập số tiền (lưu mới / sau khi quét / sửa) -->
<section class="entry" id="entry"><div class="in">
  <div class="ehead">
    <button class="back" id="eBack" aria-label="Quay lại"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="etitle" id="eTitle">Lưu khoản chi</div>
  </div>
  <div class="esub" id="eSub"></div>
  <div class="elbl">Số tiền</div>
  <div class="eamt"><span class="v zero" id="eAmt">0</span><span class="u">đ</span></div>
  <div class="echips" id="eCats"></div>
  <input class="enote" id="eNote" placeholder="Ghi chú (không bắt buộc)" enterkeyhint="done">
  <div class="keys" id="keys">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="000" class="k000">000</button><button data-k="0">0</button>
    <button data-k="del" aria-label="Xoá"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M9 5h11v14H9l-6-7z"/><path d="m12.5 9.5 5 5M17.5 9.5l-5 5"/></svg></button>
  </div>
  <div class="eacts" id="eActs"></div>
  <div class="tip" id="eTip"></div>
</div></section>

<div class="cam" id="cam">
  <video id="video" playsinline muted></video>
  <div class="frame"></div>
  <div class="hint">Đưa mã QR của quán vào khung</div>
  <div class="err" id="camErr" hidden></div>
  <div class="bar">
    <label>Chọn ảnh QR<input type="file" id="qrFile" accept="image/*" hidden></label>
    <button id="camClose">Đóng</button>
  </div>
</div>

<div class="dim" id="dim"></div>

<div class="sheet" id="hSheet">
  <div class="grip"></div>
  <div class="stitle">Lịch sử chi tiêu</div>
  <div class="hist" id="hist"></div>
</div>

<div class="sheet" id="setSheet">
  <div class="grip"></div>
  <div class="stitle">Cài đặt</div>
  <label class="field"><span style="white-space:nowrap">App ngân hàng</span><select id="appSel"></select></label>
  <div class="tip" id="appTip"></div>
  <div class="grid3">
    <button id="exportBtn">Sao lưu</button>
    <button id="importBtn">Khôi phục</button>
    <button id="csvBtn">Xuất CSV</button>
  </div>
  <div class="tip">Dữ liệu chỉ lưu trên máy này. Nên bấm Sao lưu thỉnh thoảng.</div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Hoàn tác</button></div>

<script src="jsQR.js"></script>

// "35k" -> 35000, "1tr2" -> 1200000, "1.5tr" -> 1500000, "35.000" -> 35000, "35000" -> 35000
function parseAmount(raw) {
  const s = strip(String(raw)).replace(/\s+/g, '');
  let m = s.match(/^(\d+(?:[.,]\d+)?)(tr|trieu|m|cu)(\d+)?$/);
  if (m) {
    let v = parseFloat(m[1].replace(',', '.'));
    if (m[3]) v += parseFloat('0.' + m[3]);
    return Math.round(v * 1e6);
  }
  m = s.match(/^(\d+(?:[.,]\d+)?)(k|nghin|ngan|ng|n)$/);
  if (m) return Math.round(parseFloat(m[1].replace(',', '.')) * 1e3);
  m = s.match(/^\d{1,3}(?:[.,]\d{3})+$/);
  if (m) return parseInt(s.replace(/[.,]/g, ''), 10);
  m = s.match(/^\d+$/);
  if (m) return parseInt(s, 10);
  return null;
}

// "35k cafe sáng" -> { a: 35000, n: "cafe sáng" }
const QRE = /(^|\s)(\d+(?:[.,]\d+)*)\s*(k|tr|triệu|trieu|củ|cu|m|nghìn|ngàn|nghin|ngan)?(\d+)?(?![\p{L}\d])/iu;
function parseQuick(text) {
  const m = text.match(QRE); if (!m) return null;
  const a = parseAmount(m[2] + (m[3] || '') + (m[4] || ''));
  if (!a) return null;
  return { a, n: (text.slice(0, m.index) + ' ' + text.slice(m.index + m[0].length)).replace(/\s+/g, ' ').trim() };
}

function guessCat(text) {
  const s = ' ' + strip(text || '').replace(/[^a-z0-9 ]/g, ' ') + ' ';
  let best = 'khac', len = 0;
  for (const c of CATS) for (const w of c.kw) {
    if (s.includes(' ' + w + ' ') && w.length > len) { best = c.k; len = w.length; }
  }
  return best;
}

/* ---------- Đọc mã VietQR (chuẩn EMVCo) ---------- */
function tlv(str) {
  const out = {}; let i = 0;
  while (i + 4 <= str.length) {
    const id = str.slice(i, i + 2), len = parseInt(str.slice(i + 2, i + 4), 10);
    if (isNaN(len)) break;
    out[id] = str.slice(i + 4, i + 4 + len);
    i += 4 + len;
  }
  return out;
}
function parseVietQR(text) {
  if (!/^000201/.test(text)) return null;
  const top = tlv(text);
  const r = { amount: top['54'] ? Math.round(parseFloat(top['54'])) : null, name: (top['59'] || '').trim(), raw: text };
  for (const id of ['38', '26', '27', '28']) {
    if (!top[id]) continue;
    const sub = tlv(top[id]);
    if (sub['00'] === 'A000000727' && sub['01']) {
      const ben = tlv(sub['01']);
      r.bin = ben['00']; r.acct = ben['01'];
    }
  }
  if (top['62']) { const add = tlv(top['62']); r.purpose = (add['08'] || '').trim(); }
  r.bank = BANKS[r.bin] || (r.bin ? 'Ngân hàng ' + r.bin : '');
  return r;
}

function renderHist() {
  const sorted = [...items].sort((a, b) => b.t - a.t).slice(0, 300);
  if (!sorted.length) { $('hist').innerHTML = '<div class="empty">Chưa có khoản nào.</div>'; return; }
  const groups = new Map(), tk = dayKey(Date.now()), yk = dayKey(Date.now() - 864e5);
  for (const it of sorted) { const k = dayKey(it.t); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(it); }
  let html = '';
  for (const [k, arr] of groups) {
    const d = new Date(arr[0].t);
    const title = k === tk ? 'Hôm nay' : k === yk ? 'Hôm qua' : DOW_LONG[d.getDay()] + ', ' + d.getDate() + '/' + (d.getMonth() + 1);

}

    return;
  }
  const mkey = q.bin + ':' + q.acct;
  const m = memo[mkey] || {};
  const note = m.n || q.name || q.purpose || '';
  const save1 = () => {
    const a = entryAmount(); if (!a) return false;

    memo[mkey] = { c, n: $('eNote').value.trim() || m.n || '' };

    closeEntry(); return true;
  };
  E.catPicked = !!m.c;
  openEntry({
    title: 'Trả cho ' + (q.name || 'TK ' + q.acct),
    sub: (q.bank ? q.bank + ' · ' : '') + q.acct,
    amount: q.amount, note, cat: m.c || guessCat(note),
    actions: [
      { label: 'Lưu & mở ' + bankApp().name, cls: 'primary', needAmt: true, run: () => {

}

const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
// https://dl.vietqr.io/pay?app=acb&ba=<số TK>@<mã NH>&am=<số tiền>&tn=<nội dung>&bn=<tên>&url=<quay lại>
function appLink(q, amount) {
  const app = bankApp(), code = q && CODES[q.bin];
  if (app.fill && code && q.acct) {
    const p = new URLSearchParams({ app: app.id });
    let url = 'https://dl.vietqr.io/pay?' + p + '&ba=' + encodeURIComponent(q.acct) + '@' + code;
    if (amount) url += '&am=' + amount;
    if (q.purpose) url += '&tn=' + encodeURIComponent(q.purpose);
    if (q.name) url += '&bn=' + encodeURIComponent(q.name);
    return url + '&url=' + encodeURIComponent(location.origin + location.pathname);
  }
  return IS_IOS && app.ios ? app.ios : 'https://dl.vietqr.io/pay?app=' + app.id;
}

/* ---------- Camera ---------- */
let stream = null, scanning = false;
const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });

function decodeFrom(src, w, h) {
  const scale = Math.min(1, 800 / Math.max(w, h));
  canvas.width = Math.round(w * scale); canvas.height = Math.round(h * scale);
  ctx.drawImage(src, 0, 0, canvas.width, canvas.height);
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  return jsQR(img.data, img.width, img.height, { inversionAttempts: 'attemptBoth' });
}

async function openCam() {
  $('cam').classList.add('on'); $('camErr').hidden = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
    const v = $('video'); v.srcObject = stream; await v.play();
    scanning = true; tick();
  } catch (err) {
    $('camErr').hidden = false;
    $('camErr').textContent = 'Không mở được camera. Hãy cho phép quyền camera, hoặc bấm "Chọn ảnh QR" để dùng ảnh chụp màn hình.';
  }
}
function closeCam() {
  scanning = false;
  stream?.getTracks().forEach(t => t.stop()); stream = null;
  $('cam').classList.remove('on');
}
function tick() {
  if (!scanning) return;
  const v = $('video');
  if (v.readyState >= 2 && v.videoWidth) {
    const r = decodeFrom(v, v.videoWidth, v.videoHeight);
    if (r && r.data) { navigator.vibrate?.(40); closeCam(); onScanned(r.data); return; }
  }
  setTimeout(() => requestAnimationFrame(tick), 120);
}
$('scanBtn').onclick = openCam;
$('camClose').onclick = closeCam;
$('qrFile').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const r = decodeFrom(img, img.naturalWidth, img.naturalHeight);
    URL.revokeObjectURL(img.src);
    if (r && r.data) { closeCam(); onScanned(r.data); } else toast('Không đọc được mã QR trong ảnh');
  };
  img.src = URL.createObjectURL(f);
};

/* ---------- Cài đặt & sao lưu ---------- */
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const stamp = () => new Date().toISOString().slice(0, 10);
$('exportBtn').onclick = () => download('pay-' + stamp() + '.json', JSON.stringify({ items, memo }), 'application/json');
$('csvBtn').onclick = () => {
  const rows = [['Ngày', 'Giờ', 'Số tiền', 'Danh mục', 'Ghi chú']].concat(
    [...items].sort((a, b) => a.t - b.t).map(it => { const d = new Date(it.t); return [d.toLocaleDateString('vi-VN'), hhmm(it.t), it.a, (CAT[it.c] || CAT.khac).name, it.n || '']; }));
  download('pay-' + stamp() + '.csv', '﻿' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n'), 'text/csv');
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    const ids = new Set(items.map(x => x.id));
    const add = (d.items || []).filter(x => x && x.id && x.a && !ids.has(x.id));
    items = items.concat(add); memo = Object.assign({}, d.memo || {}, memo);
    save(); render(); toast('Đã khôi phục ' + add.length + ' khoản');
  } catch { toast('File sao lưu không hợp lệ'); }
};

const opt = a => '<option value="' + a.id + '"' + (a.id === bankApp().id ? ' selected' : '') + '>' + esc(a.name) + '</option>';
$('appSel').innerHTML = '<optgroup label="Mở sẵn người nhận + số tiền">' + APPS.filter(a => a.fill).map(opt).join('') + '</optgroup>'
  + '<optgroup label="Chỉ mở app (quét lại QR)">' + APPS.filter(a => !a.fill).map(opt).join('') + '</optgroup>';
const appTip = () => $('appTip').textContent = bankApp().fill ? 'Mở sẵn người nhận và số tiền, không phải quét lại.' : 'App này chỉ mở được, bạn sẽ quét lại mã QR trong app.';
$('appSel').onchange = e => { appId = e.target.value; try { localStorage.setItem('sochi.app', JSON.stringify(appId)); } catch {} appTip(); };
$('setBtn').onclick = () => { appTip(); openS('setSheet'); };

render();
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');
</script>
