name: Pay
options:
  bundleIdPrefix: com.hnaht95
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: U5DGWB7A5X   # tài khoản nhà phát triển cá nhân (trả phí)
targets:
  Pay:
    type: application
    platform: iOS
    sources: [Pay, Shared]
    dependencies:
      - target: PayWidget
    attributes:
      SystemCapabilities:
        com.apple.iCloud: {enabled: 1}
        com.apple.ApplicationGroups.iOS: {enabled: 1}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hnaht95.sochipay
        PRODUCT_NAME: Pay
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    entitlements:
      path: Pay/Pay.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.hnaht95.sochipay]
        com.apple.developer.icloud-services: [CloudDocuments, CloudKit]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.hnaht95.sochipay]
        com.apple.security.application-groups: [group.com.hnaht95.sochipay]
        aps-environment: development
    info:
      path: Pay/Info.plist
      properties:
        CFBundleDisplayName: Pay
        CKSharingSupported: true
        UIBackgroundModes: [remote-notification]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Pay dùng camera để quét mã QR thanh toán.
        NSMicrophoneUsageDescription: Pay dùng micro để nghe bạn đọc khoản chi, ví dụ "35k cafe".
        NSSpeechRecognitionUsageDescription: Pay chuyển giọng nói thành chữ để ghi khoản chi.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.hnaht95.pay
            CFBundleURLSchemes: [sochipay]
        LSApplicationQueriesSchemes:
          - abaapp
          - abbankmobile
          - acbone
          - agribankmobile
          - baovietmobile
          - bidv.smartbanking.partner
          - cake.vn
          - cimb
          - coopbankmobile
          - eximbankmobile
          - hdbankmobile
          - hydro
          - kienlongbankmobilebanking
          - lv24h
          - mbbank
          - myvib
          - myvib2
          - namabankmobile
          - ncbizimobile
          - newomni-app
          - oceanbankmobilebanking
          - plus
          - publicbankmobile
          - pvcombankapp
          - qpaymobile
          - saigonbankmobilebanking
          - scbmobilebanking
          - seamobile
          - shbmobile
          - shinhanglbvnbank
          - tcb
          - vabmobilebanking
          - vietbankmobilebanking
          - vietcombankmobile
          - vietinbankipay
          - vpbankneo
          - wvbs
  PayWidget:
    type: app-extension
    platform: iOS
    sources: [PayWidget, Shared]
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS: {enabled: 1}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hnaht95.sochipay.widget
        PRODUCT_NAME: PayWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: PayWidget/PayWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hnaht95.sochipay]
    info:
      path: PayWidget/Info.plist
      properties:
        CFBundleDisplayName: Pay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
