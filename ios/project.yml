name: Pay
options:
  bundleIdPrefix: com.hnaht95
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Pay:
    type: application
    platform: iOS
    sources: [Pay]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hnaht95.pay
        PRODUCT_NAME: Pay
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: Pay/Info.plist
      properties:
        CFBundleDisplayName: Pay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Pay dùng camera để quét mã QR thanh toán.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.hnaht95.pay
            CFBundleURLSchemes: [sochipay]
        LSApplicationQueriesSchemes:
          - abaapp
          - abbankmobile
          - acbone
          - agribankmobile
          - baovietmobile
          - bidv.smartbanking.partner
          - cake.vn
          - cimb
          - coopbankmobile
          - eximbankmobile
          - hdbankmobile
          - hydro
          - kienlongbankmobilebanking
          - lv24h
          - mbbank
          - myvib
          - myvib2
          - namabankmobile
          - ncbizimobile
          - newomni-app
          - oceanbankmobilebanking
          - plus
          - publicbankmobile
          - pvcombankapp
          - qpaymobile
          - saigonbankmobilebanking
          - scbmobilebanking
          - seamobile
          - shbmobile
          - shinhanglbvnbank
          - tcb
          - vabmobilebanking
          - vietbankmobilebanking
          - vietcombankmobile
          - vietinbankipay
          - vpbankneo
          - wvbs
