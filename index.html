<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pay</title>
<meta name="theme-color" content="#e9e9ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pay">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #e9e9ec;
  --card-a: #fdfdfd;
  --card-b: #f1f1f3;
  --panel-a: #e3e3e7;
  --panel-b: #f4f4f6;
  --ink: #0f0f10;
  --muted: #8e8e93;
  --line: rgba(0, 0, 0, .07);
  --pill: rgba(0, 0, 0, .055);
  --btn-a: #ffffff;
  --btn-b: #ececef;
  --hi: rgba(255, 255, 255, .95);
  --shadow: rgba(20, 20, 30, .16);
  --cta-a: #3a3a3c;
  --cta-b: #000000;
  --cta-ink: #ffffff;
  --sheet: #fbfbfc;
  --danger: #d92d20;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0c;
    --card-a: #1f1f22;
    --card-b: #161618;
    --panel-a: #2a2a2e;
    --panel-b: #1d1d20;
    --ink: #f5f5f7;
    --muted: #8e8e93;
    --line: rgba(255, 255, 255, .08);
    --pill: rgba(255, 255, 255, .08);
    --btn-a: #2c2c30;
    --btn-b: #222225;
    --hi: rgba(255, 255, 255, .08);
    --shadow: rgba(0, 0, 0, .6);
    --cta-a: #ffffff;
    --cta-b: #d9d9de;
    --cta-ink: #000000;
    --sheet: #1c1c1f;
    --danger: #ff6b5e;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }

/* ---------- Thẻ chính ---------- */
.stage {
  min-height: 100dvh; display: flex; align-items: center; justify-content: center;
  padding: calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px);
}
.device {
  width: 100%; max-width: 440px; padding: 10px; border-radius: 46px;
  background: linear-gradient(180deg, var(--card-a), var(--card-b));
  box-shadow: 0 40px 80px -20px var(--shadow), 0 2px 6px rgba(0,0,0,.05), inset 0 1.5px 0 var(--hi), inset 0 -3px 8px rgba(0,0,0,.04);
}
.panel {
  position: relative; border-radius: 38px 38px 56px 56px; padding: 18px 18px 64px;
  background: linear-gradient(180deg, var(--panel-a), var(--panel-b));
  box-shadow: inset 0 1px 0 var(--hi), inset 0 -1px 0 var(--line);
}
.top { display: flex; align-items: center; justify-content: space-between; }
.me { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; }
.logo { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 700; color: #fff; background: linear-gradient(145deg, #3a3a3c, #000); box-shadow: 0 0 0 3px var(--card-a), 0 2px 6px rgba(0,0,0,.15); }
.date { font-size: 13px; color: var(--muted); padding: 6px 12px; border-radius: 999px; background: var(--pill); }
.badge { display: table; margin: 18px auto 0; padding: 6px 14px; border-radius: 999px; background: var(--pill); color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: .6px; text-transform: uppercase; }
.today { text-align: center; font-size: clamp(42px, 14vw, 60px); font-weight: 600; letter-spacing: -2px; line-height: 1.1; margin-top: 10px; font-variant-numeric: tabular-nums; }
.today small { font-size: .55em; font-weight: 500; letter-spacing: 0; margin-left: 4px; color: var(--muted); }
.month { text-align: center; color: var(--muted); font-size: 14px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.month b { color: var(--ink); font-weight: 600; }

/* Hàng danh mục (các vòng tròn) */
.cats { display: flex; justify-content: space-evenly; margin: -36px 0 0; position: relative; z-index: 1; padding: 0 2px; }
.cat { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 19%; max-width: 66px; }
.dot {
  width: min(60px, 15vw); height: min(60px, 15vw); border-radius: 50%; display: grid; place-items: center; font-size: min(26px, 6.6vw);
  border: 4px solid var(--card-a);
  box-shadow: 0 8px 16px -6px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.55), inset 0 -4px 8px rgba(0,0,0,.08);
  transition: transform .12s;
}
.cat:active .dot { transform: scale(.92); }
.cat .lbl { font-size: 11px; color: var(--muted); white-space: nowrap; }

/* Thẻ giao dịch gần đây */
.recent {
  margin: 14px 4px 0; padding: 14px 16px 6px; border-radius: 30px;
  background: linear-gradient(180deg, var(--btn-a), var(--btn-b));
  box-shadow: inset 0 1px 0 var(--hi), 0 1px 2px rgba(0,0,0,.04);
}
.rhead { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--muted); }
.rhead button { color: var(--ink); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 0; text-align: left; }
.row + .row { border-top: 1px solid var(--line); }
.ic { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 21px; flex: none; border: 3px solid var(--card-a); box-shadow: 0 3px 8px -3px rgba(0,0,0,.2); }
.tx { flex: 1; min-width: 0; }
.nt { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tm { color: var(--muted); font-size: 13px; margin-top: 1px; }
.am { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; align-self: flex-end; padding-bottom: 2px; }
.empty { color: var(--muted); font-size: 14px; padding: 16px 0 14px; line-height: 1.55; }
.empty b { color: var(--ink); font-weight: 600; }

/* Hai nút cực lớn */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 4px 4px; }
.big {
  height: clamp(120px, 34vw, 150px); border-radius: 40px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px; font-size: 22px; font-weight: 600; letter-spacing: -.3px;
  transition: transform .12s;
}
.big svg { width: 38px; height: 38px; }
.big:active { transform: scale(.97); }
.soft {
  background: linear-gradient(180deg, var(--btn-a), var(--btn-b));
  box-shadow: inset 0 1px 0 var(--hi), 0 1px 3px rgba(0,0,0,.06), 0 10px 20px -12px rgba(0,0,0,.25);
}
.cta {
  color: var(--cta-ink);
  background: linear-gradient(180deg, var(--cta-a), var(--cta-b));
  box-shadow: 0 18px 30px -12px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18);
}
.tright { display: flex; align-items: center; gap: 8px; }
.gear { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--pill); color: var(--muted); }
.gear svg { width: 18px; height: 18px; }

/* ---------- Camera ---------- */
.cam { position: fixed; inset: 0; background: #000; z-index: 50; display: none; }
.cam.on { display: block; }
.cam video { width: 100%; height: 100%; object-fit: cover; }
.cam .frame { position: absolute; top: 50%; left: 50%; width: 68vmin; height: 68vmin; transform: translate(-50%, -55%); border: 3px solid rgba(255,255,255,.9); border-radius: 36px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.5); }
.cam .hint { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 24px); text-align: center; color: #fff; font-size: 15px; padding: 0 16px; }
.cam .bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
.cam .bar button, .cam .bar label { flex: 1; height: 60px; display: grid; place-items: center; border-radius: 999px; background: rgba(255,255,255,.16); color: #fff; font-weight: 500; font-size: 17px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); cursor: pointer; }
.cam .err { position: absolute; top: 40%; left: 16px; right: 16px; color: #fff; text-align: center; line-height: 1.5; }

/* ---------- Sheet ---------- */
.dim { position: fixed; inset: 0; background: rgba(0,0,0,.32); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s; }
.dim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-width: 460px; margin: 0 auto;
  background: var(--sheet); border-radius: 36px 36px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow: 0 -10px 40px rgba(0,0,0,.15), inset 0 1px 0 var(--hi);
  transform: translateY(105%); transition: transform .25s cubic-bezier(.2,.8,.2,1);
  max-height: 88dvh; display: flex; flex-direction: column;
}
.sheet.on { transform: none; }
.grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; flex: none; }
.stitle { font-size: 13px; color: var(--muted); text-align: center; text-transform: uppercase; letter-spacing: .6px; font-weight: 500; }
.sname { font-size: 18px; font-weight: 600; text-align: center; margin-top: 4px; overflow-wrap: anywhere; }
.amt { display: flex; align-items: center; gap: 8px; margin: 16px 0 2px; padding: 4px 6px 4px 18px; border-radius: 999px; background: var(--pill); }
.amt input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 34px; font-weight: 600; padding: 6px 0; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.kbtn { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(180deg, var(--btn-a), var(--btn-b)); box-shadow: inset 0 1px 0 var(--hi), 0 2px 6px rgba(0,0,0,.1); font-size: 20px; font-weight: 600; flex: none; }
.hint2 { color: var(--muted); font-size: 13px; min-height: 18px; margin: 6px 0 10px; text-align: center; }
.note { width: 100%; padding: 14px 18px; border-radius: 999px; border: 0; background: var(--pill); outline: none; margin-bottom: 14px; font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 18px; }
.chips button { padding: 9px 14px; border-radius: 999px; background: var(--pill); font-size: 15px; }
.chips button.sel { background: var(--ink); color: var(--bg); }
.acts { display: flex; flex-direction: column; gap: 8px; }
.primary { height: 58px; border-radius: 999px; color: var(--cta-ink); font-weight: 600; font-size: 17px; background: linear-gradient(180deg, var(--cta-a), var(--cta-b)); box-shadow: 0 10px 20px -10px rgba(0,0,0,.5); }
.secondary { height: 54px; border-radius: 999px; font-weight: 500; background: var(--pill); }
.del { height: 48px; color: var(--danger); font-weight: 500; }
.tip { color: var(--muted); font-size: 12px; text-align: center; margin-top: 10px; line-height: 1.45; }
.qinput { width: 100%; padding: 18px 22px; border-radius: 999px; border: 0; background: var(--pill); outline: none; font-size: 22px; font-weight: 500; text-align: center; margin-top: 14px; }

/* Lịch sử */
.hist { overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 6px -4px 0; padding: 0 4px; }
.day { margin-top: 14px; }
.dayhead { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; padding: 0 2px 4px; }
.hist .row { padding: 8px 0; }
.hist .ic { width: 40px; height: 40px; font-size: 18px; border-width: 2px; }
.hist .nt { font-size: 16px; }
.hist .am { font-size: 16px; }

/* Cài đặt */
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-radius: 999px; background: var(--pill); margin-top: 14px; }
.field select { border: 0; background: none; outline: none; text-align: right; font-weight: 600; max-width: 60%; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.grid3 button { height: 54px; border-radius: 999px; background: var(--pill); font-weight: 500; font-size: 15px; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--cta-b); color: var(--cta-ink); padding: 14px 16px 14px 22px; border-radius: 999px; display: flex; gap: 16px; align-items: center; transition: .2s; z-index: 60; white-space: nowrap; font-size: 15px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
<div class="stage">
  <main class="device">
    <section class="panel">
      <div class="top">
        <div class="me"><span class="logo">₫</span>Pay</div>
        <div class="tright">
          <div class="date" id="date"></div>
          <button class="gear" id="setBtn" aria-label="Cài đặt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.8 20 7.4v9.2l-8 4.6-8-4.6V7.4z"/><circle cx="12" cy="12" r="3.2"/></svg></button>
        </div>
      </div>
      <div class="badge">Hôm nay đã chi</div>
      <div class="today" id="today">0<small>đ</small></div>
      <div class="month" id="month"></div>
    </section>

    <div class="cats" id="cats"></div>

    <section class="recent">
      <div class="rhead"><span>Gần đây</span><button id="allBtn">Xem tất cả</button></div>
      <div id="recent"></div>
    </section>

    <nav class="actions">
      <button class="big soft" id="typeBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Lưu
      </button>
      <button class="big cta" id="scanBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M7 12h10"/></svg>
        Quét QR
      </button>
    </nav>
  </main>
</div>

<div class="cam" id="cam">
  <video id="video" playsinline muted></video>
  <div class="frame"></div>
  <div class="hint">Đưa mã QR của quán vào khung</div>
  <div class="err" id="camErr" hidden></div>
  <div class="bar">
    <label>Chọn ảnh QR<input type="file" id="qrFile" accept="image/*" hidden></label>
    <button id="camClose">Đóng</button>
  </div>
</div>

<div class="dim" id="dim"></div>

<!-- Ghi sau khi quét / sửa khoản -->
<div class="sheet" id="sheet">
  <div class="grip"></div>
  <div class="stitle" id="sTo">Trả cho</div>
  <div class="sname" id="sName"></div>
  <div class="amt"><input id="sAmt" inputmode="numeric" placeholder="0"><button type="button" class="kbtn" id="sK">k</button></div>
  <div class="hint2" id="sHint"></div>
  <input class="note" id="sNote" placeholder="Ghi chú (không bắt buộc)">
  <div class="chips" id="sCats"></div>
  <div class="acts" id="sActs"></div>
  <div class="tip" id="sTip"></div>
</div>

<!-- Gõ tay -->
<form class="sheet" id="qSheet" autocomplete="off">
  <div class="grip"></div>
  <div class="stitle" id="qTitle">Lưu khoản chi</div>
  <input class="qinput" id="qi" placeholder="35k cafe" enterkeyhint="done">
  <div class="hint2" id="qprev">Ví dụ: 35k cafe · grab 52000 · 1tr2 tiền nhà</div>
  <div class="acts"><button class="primary" type="submit">Ghi</button></div>
</form>

<!-- Lịch sử -->
<div class="sheet" id="hSheet">
  <div class="grip"></div>
  <div class="stitle">Lịch sử chi tiêu</div>
  <div class="hist" id="hist"></div>
</div>

<!-- Cài đặt -->
<div class="sheet" id="setSheet">
  <div class="grip"></div>
  <div class="stitle">Cài đặt</div>
  <label class="field"><span style="white-space:nowrap">App ngân hàng</span><select id="appSel"></select></label>
  <div class="tip" id="appTip"></div>
  <div class="grid3">
    <button id="exportBtn">Sao lưu</button>
    <button id="importBtn">Khôi phục</button>
    <button id="csvBtn">Xuất CSV</button>
  </div>
  <div class="tip">Dữ liệu chỉ lưu trên máy này. Nên bấm Sao lưu thỉnh thoảng.</div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Hoàn tác</button></div>

<script src="jsQR.js"></script>

// "35k" -> 35000, "1tr2" -> 1200000, "1.5tr" -> 1500000, "35.000" -> 35000, "35000" -> 35000
function parseAmount(raw) {
  const s = strip(String(raw)).replace(/\s+/g, '');
  let m = s.match(/^(\d+(?:[.,]\d+)?)(tr|trieu|m|cu)(\d+)?$/);
  if (m) {
    let v = parseFloat(m[1].replace(',', '.'));
    if (m[3]) v += parseFloat('0.' + m[3]);
    return Math.round(v * 1e6);
  }
  m = s.match(/^(\d+(?:[.,]\d+)?)(k|nghin|ngan|ng|n)$/);
  if (m) return Math.round(parseFloat(m[1].replace(',', '.')) * 1e3);
  m = s.match(/^\d{1,3}(?:[.,]\d{3})+$/);
  if (m) return parseInt(s.replace(/[.,]/g, ''), 10);
  m = s.match(/^\d+$/);
  if (m) return parseInt(s, 10);
  return null;
}

// "35k cafe sáng" -> { a: 35000, n: "cafe sáng" }
const QRE = /(^|\s)(\d+(?:[.,]\d+)*)\s*(k|tr|triệu|trieu|củ|cu|m|nghìn|ngàn|nghin|ngan)?(\d+)?(?![\p{L}\d])/iu;
function parseQuick(text) {
  const m = text.match(QRE); if (!m) return null;
  const a = parseAmount(m[2] + (m[3] || '') + (m[4] || ''));
  if (!a) return null;
  return { a, n: (text.slice(0, m.index) + ' ' + text.slice(m.index + m[0].length)).replace(/\s+/g, ' ').trim() };
}

function guessCat(text) {
  const s = ' ' + strip(text || '').replace(/[^a-z0-9 ]/g, ' ') + ' ';
  let best = 'khac', len = 0;
  for (const c of CATS) for (const w of c.kw) {
    if (s.includes(' ' + w + ' ') && w.length > len) { best = c.k; len = w.length; }
  }
  return best;
}

/* ---------- Đọc mã VietQR (chuẩn EMVCo) ---------- */
function tlv(str) {
  const out = {}; let i = 0;
  while (i + 4 <= str.length) {
    const id = str.slice(i, i + 2), len = parseInt(str.slice(i + 2, i + 4), 10);
    if (isNaN(len)) break;
    out[id] = str.slice(i + 4, i + 4 + len);
    i += 4 + len;
  }
  return out;
}
function parseVietQR(text) {
  if (!/^000201/.test(text)) return null;
  const top = tlv(text);
  const r = { amount: top['54'] ? Math.round(parseFloat(top['54'])) : null, name: (top['59'] || '').trim(), raw: text };
  for (const id of ['38', '26', '27', '28']) {
    if (!top[id]) continue;
    const sub = tlv(top[id]);
    if (sub['00'] === 'A000000727' && sub['01']) {
      const ben = tlv(sub['01']);
      r.bin = ben['00']; r.acct = ben['01'];
    }
  }
  if (top['62']) { const add = tlv(top['62']); r.purpose = (add['08'] || '').trim(); }
  r.bank = BANKS[r.bin] || (r.bin ? 'Ngân hàng ' + r.bin : '');
  return r;
}

/* ---------- Camera ---------- */
let stream = null, scanning = false;
const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });

function decodeFrom(src, w, h) {
  const scale = Math.min(1, 800 / Math.max(w, h));
  canvas.width = Math.round(w * scale); canvas.height = Math.round(h * scale);
  ctx.drawImage(src, 0, 0, canvas.width, canvas.height);
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  return jsQR(img.data, img.width, img.height, { inversionAttempts: 'attemptBoth' });
}

async function openCam() {
  $('cam').classList.add('on'); $('camErr').hidden = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
    const v = $('video'); v.srcObject = stream; await v.play();
    scanning = true; tick();
  } catch (err) {
    $('camErr').hidden = false;
    $('camErr').textContent = 'Không mở được camera. Hãy cho phép quyền camera, hoặc bấm "Chọn ảnh QR" để dùng ảnh chụp màn hình.';
  }
}
function closeCam() {
  scanning = false;
  stream?.getTracks().forEach(t => t.stop()); stream = null;
  $('cam').classList.remove('on');
}
function tick() {
  if (!scanning) return;
  const v = $('video');
  if (v.readyState >= 2 && v.videoWidth) {
    const r = decodeFrom(v, v.videoWidth, v.videoHeight);
    if (r && r.data) { navigator.vibrate?.(40); closeCam(); onScanned(r.data); return; }
  }
  setTimeout(() => requestAnimationFrame(tick), 120);
}
$('scanBtn').onclick = openCam;
$('camClose').onclick = closeCam;
$('qrFile').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const r = decodeFrom(img, img.naturalWidth, img.naturalHeight);
    URL.revokeObjectURL(img.src);
    if (r && r.data) { closeCam(); onScanned(r.data); } else toast('Không đọc được mã QR trong ảnh');
  };
  img.src = URL.createObjectURL(f);
};

/* ---------- Cài đặt & sao lưu ---------- */
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const stamp = () => new Date().toISOString().slice(0, 10);
$('exportBtn').onclick = () => download('pay-' + stamp() + '.json', JSON.stringify({ items, memo }), 'application/json');
$('csvBtn').onclick = () => {
  const rows = [['Ngày', 'Giờ', 'Số tiền', 'Danh mục', 'Ghi chú']].concat(
    [...items].sort((a, b) => a.t - b.t).map(it => { const d = new Date(it.t); return [d.toLocaleDateString('vi-VN'), hhmm(it.t), it.a, (CAT[it.c] || CAT.khac).name, it.n || '']; }));
  download('pay-' + stamp() + '.csv', '﻿' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n'), 'text/csv');
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    const ids = new Set(items.map(x => x.id));
    const add = (d.items || []).filter(x => x && x.id && x.a && !ids.has(x.id));
    items = items.concat(add); memo = Object.assign({}, d.memo || {}, memo);
    save(); render(); toast('Đã khôi phục ' + add.length + ' khoản');
  } catch { toast('File sao lưu không hợp lệ'); }
};

const opt = a => '<option value="' + a.id + '"' + (a.id === bankApp().id ? ' selected' : '') + '>' + esc(a.name) + '</option>';
$('appSel').innerHTML = '<optgroup label="Mở sẵn người nhận + số tiền">' + APPS.filter(a => a.fill).map(opt).join('') + '</optgroup>'
  + '<optgroup label="Chỉ mở app (quét lại QR)">' + APPS.filter(a => !a.fill).map(opt).join('') + '</optgroup>';
const appTip = () => $('appTip').textContent = bankApp().fill ? 'Mở sẵn người nhận và số tiền, không phải quét lại.' : 'App này chỉ mở được, bạn sẽ quét lại mã QR trong app.';
$('appSel').onchange = e => { appId = e.target.value; try { localStorage.setItem('sochi.app', JSON.stringify(appId)); } catch {} appTip(); };
$('setBtn').onclick = () => { appTip(); openS('setSheet'); };

render();
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
